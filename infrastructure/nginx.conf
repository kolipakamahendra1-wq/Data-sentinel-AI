server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the backend per request so a recreated backend container (new IP) is picked up.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 300s;  # local LLM investigations can take a minute
    }

    location / {
        try_files $uri /index.html;
    }
}
